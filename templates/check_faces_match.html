<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face Recognition</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        #live-preview {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #live-frame {
            margin-top: 20px;
            border: 2px solid #333;
        }

        #face-match-results {
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <div id="live-preview">
        <div id="live-frame"></div>
        <div id="face-match-results"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const socket = io.connect();

            socket.on('update_frame', function (data) {
                const liveFrame = document.getElementById('live-frame');
                const faceMatchResults = document.getElementById('face-match-results');

                // Update live frame
                const img = new Image();
                img.src = 'data:image/jpeg;base64,' + data.frame;
                liveFrame.innerHTML = '';
                liveFrame.appendChild(img);

                // Update face match results
                const resultsHTML = data.face_match_results.map(result => {
                    return `<div>Name: ${result.name}, Roll No: ${result.roll_no}</div>`;
                }).join('');
                faceMatchResults.innerHTML = resultsHTML;
            });
        });
    </script>
</body>

</html>
