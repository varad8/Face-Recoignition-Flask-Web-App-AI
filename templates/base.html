<!-- templates/base.html -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://site-assets.fontawesome.com/releases/v6.5.1/css/all.css">

    <title>{% block page_title %}My Dashboard{% endblock %}</title>

    <!-- Tailwind CSS -->
    <link rel="stylesheet" href="static/css/tailwind-ui.css">
    <style>
        @media (min-width: 640px) {

            /* Larger screens */
            .content-container {
                margin-left: 250px;

            }

            aside {
                width: 250px;
            }

            .menu-toggle,
            .close-toggle {
                display: none;
                /* Hide the toggle button on desktop */
            }
        }

        @media (max-width: 639px) {

            /* Smaller screens */
            .content-container {
                margin-left: 0;
            }

            aside {
                width: 100%;
                display: none;
                /* Initially hide the menu on smaller screens */
            }

            aside.show {
                display: block;

                /* Show the menu when the class 'show' is added */
            }

            .menu-toggle,
            .close-toggle {
                display: block;
                cursor: pointer;
            }

            .close-toggle {
                position: absolute;
                top: 10px;
                right: 10px;
            }

        }
    </style>
</head>

<body class="relative bg-yellow-50 overflow-hidden max-h-screen">
    <div class="menu-toggle px-4 py-2 cursor-pointer text-gray-600 bg-yellow-200">
        <div class="flex items-center justify-between ">
            <div class="flex items-center">
                <i class="fa-duotone fa-bars text-lg"></i>
                <h1 class="text-md font-bold px-3 leading-none"><span class="text-yellow-700">Face Recognization
                    </span> Attendance System
                </h1>
            </div>
            <!-- Avatar Container -->
            <div class="bg-white p-4 rounded-full shadow-md">
                <!-- Avatar Image -->
                <img src="your-avatar-image.jpg" alt="Avatar" class="w-4 h-4 object-cover rounded-full">
            </div>
        </div>
    </div>
    <aside class="fixed inset-y-0 left-0 bg-white shadow-md max-h-screen w-60">
        <div class="close-toggle px-2 py-2 cursor-pointer text-gray-600">
            <i class="fa-duotone fa-xmark text-lg"></i>
        </div>
        <div class="flex flex-col justify-between h-full ">
            <div class="flex-grow">
                <div class="px-4 py-6 text-center border-b">
                    <h1 class="text-lg font-bold leading-none"><span class="text-yellow-700">Face Recognization
                        </span> Attendance System
                    </h1>
                </div>
                <div class="p-4">
                    <ul class="space-y-1">

                        <!-- Default Dashboard -->
                        <li>
                            <a href="/dashboard"
                                class="flex items-center  rounded-xl font-bold text-sm text-yellow-900 py-3 px-4">
                                <i class="fa-duotone fa-chart-line-down mr-4 text-lg"></i>
                                Dashboard
                            </a>
                        </li>

                        <!-- Add Sudent -->
                        <li>
                            <a href="/add_student"
                                class="flex items-center rounded-xl font-bold text-sm text-yellow-900 py-3 px-4">
                                <i class="fa-duotone fa-screen-users mr-4 text-lg"></i>
                                Add Student
                            </a>
                        </li>

                        <!-- Add Sudent -->
                        <li>
                            <a href="/student_list"
                                class="flex items-center rounded-xl font-bold text-sm text-yellow-900 py-3 px-4">
                                <i class="fa-duotone fa-list mr-4 text-lg"></i>
                                Student List
                            </a>
                        </li>


                    </ul>
                </div>
            </div>
            <div class="p-4">
                <a href="{{ url_for('logout') }}">
                    <button type="button"
                        class="inline-flex items-center justify-center h-9 px-4 rounded-xl bg-gray-900 text-gray-300 hover:text-white text-sm font-semibold transition">
                        <i class="fa-duotone fa-arrow-right-from-bracket"></i>
                    </button> <span class="font-bold text-sm ml-2">Logout</span>
                </a>
            </div>
        </div>
    </aside>

    <main class="ml-0 pt-0 max-h-screen overflow-auto content-container">
        <div class="px-6 py-8">
            <div class="max-w-8xl mx-auto">
                <div class="bg-white rounded-3xl p-8 mb-5">
                    {% block content %}{% endblock %}
                </div>
            </div>
        </div>
    </main>
    <script>
        // JavaScript to handle the toggle functionality
        const menuToggle = document.querySelector('.menu-toggle');
        const closeToggle = document.querySelector('.close-toggle');
        const asideMenu = document.querySelector('aside');

        menuToggle.addEventListener('click', () => {
            asideMenu.classList.toggle('show');
        });

        closeToggle.addEventListener('click', () => {
            asideMenu.classList.remove('show');
        });

        // Add logic to set the active state based on the current URL path
        const currentPath = window.location.pathname;
        const links = document.querySelectorAll('aside ul li a');

        links.forEach(link => {
            if (link.getAttribute('href') === currentPath) {
                link.classList.add('bg-yellow-200');
            }
        });
    </script>
</body>
