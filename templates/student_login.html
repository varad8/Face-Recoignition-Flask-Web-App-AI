<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Tailwind CSS -->
    <link rel="stylesheet" href="static/css/tailwind-ui.css">
    <title>Student Login</title>
</head>

<body class="bg-cover bg-center bg-no-repeat bg-fixed"
    style="background-image: url('static/800_390_face-recognition.png')">

    <div class="min-h-screen flex items-center justify-center">
        <div class="bg-white bg-opacity-80 p-8 rounded-md w-96 text-center">
            <h1 class="text-3xl mb-4 font-bold">Student Login</h1>
            {% if error %}
            <p class="text-red-500">{{ error }}</p>
            {% endif %}
            <form action="/student_result" method="post" class="space-y-4">
                <div>
                    <label for="roll_no" class="block text-left">Roll No:</label>
                    <input type="number" id="roll_no" name="roll_no" required
                        class="w-full px-3 py-2 border rounded-md focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label for="password" class="block text-left">Password:</label>
                    <input type="password" id="password" name="password" required
                        class="w-full px-3 py-2 border rounded-md focus:outline-none focus:border-blue-500">
                </div>
                <button type="submit"
                    class="w-full bg-green-500 text-white py-2 px-4 rounded-md hover:bg-green-600 focus:outline-none focus:bg-green-600">
                    Login
                </button>
            </form>
        </div>
    </div>

</body>

</html>
